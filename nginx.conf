server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Файлы сборки Vite с хешем в имени — можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем, чтобы после деплоя сразу подтягивалась новая версия
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: vue-router в режиме history — все неизвестные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
