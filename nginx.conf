server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Файлы сборки Vite с хешем в имени — можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем, чтобы после деплоя сразу подтягивалась новая версия
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA: service worker и его загрузчик тоже без кеша — иначе установленное
    # приложение может долго не видеть новую версию сайта
    location ~ ^/(sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: vue-router в режиме history — все неизвестные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
